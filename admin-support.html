<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H ebooks | Suporte</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f4ff;color:#191725}.wrap{max-width:1000px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(60,45,130,.12)}h1{margin:0 0 8px}.muted{color:#6d687b}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd8ed;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#5b3df5;color:#fff;font-weight:800;cursor:pointer}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.tickets{display:grid;gap:14px}.ticket{border:1px solid #e8e4f2;border-radius:16px;padding:18px}.ticket-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.open{background:#fff0c7;color:#745400}.closed{background:#e6f6eb;color:#1f6d3a}.meta{font-size:13px;color:#6d687b;margin:8px 0}.problem{background:#f8f7fc;border-radius:10px;padding:12px;white-space:pre-wrap}.close-box{margin-top:12px}.close-box textarea{min-height:70px;margin-bottom:8px}.danger{background:#8f2d3d}.ok{color:#1f7a43;font-weight:700}.warn{color:#a56600;font-weight:700}
</style></head>
<body><div class="wrap"><div class="card">
<h1>H ebooks • Suporte</h1><p class="muted">Painel administrativo de atendimentos.</p>
<div id="login"><div class="row"><div><label>Código administrativo</label><input id="admin-code" type="password" placeholder="Digite o código"></div><button id="login-btn">Entrar</button></div><p id="login-msg"></p></div>
<div id="panel" style="display:none"><div class="toolbar"><select id="filter"><option value="OPEN">Abertos</option><option value="CLOSED">Encerrados</option><option value="ALL">Todos</option></select><button id="refresh">Atualizar</button></div><div id="tickets" class="tickets"></div></div>
</div></div>
<script>
const API="https://faoasptdjhdtonnvflbd.supabase.co/functions/v1/support-api";
let adminCode="";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Erro");return d}
async function load(){const box=document.getElementById("tickets");box.innerHTML="Carregando...";try{const d=await api({action:"admin-list",adminCode,status:document.getElementById("filter").value});box.innerHTML=d.tickets.length?"":"Nenhum atendimento encontrado.";d.tickets.forEach(t=>{const el=document.createElement("div");el.className="ticket";const emailState=t.email_notified?'<span class="ok">E-mail enviado</span>':'<span class="warn">E-mail pendente</span>';el.innerHTML='<div class="ticket-head"><strong>'+esc(t.ticket_code)+'</strong><span class="badge '+(t.status==="OPEN"?"open":"closed")+'">'+esc(t.status)+'</span></div><div class="meta">'+esc(t.buyer_name)+' • '+esc(t.buyer_email)+' • '+new Date(t.created_at).toLocaleString("pt-BR")+' • '+emailState+'</div><div class="problem">'+esc(t.problem)+'</div>'+(t.status==="OPEN"?'<div class="close-box"><textarea placeholder="Motivo do encerramento"></textarea><button class="danger">Encerrar atendimento</button></div>':'<div class="meta"><strong>Motivo:</strong> '+esc(t.close_reason||"")+'</div>');if(t.status==="OPEN"){const ta=el.querySelector("textarea"),bt=el.querySelector(".danger");bt.onclick=async()=>{const reason=ta.value.trim();if(reason.length<3){alert("Informe o motivo.");return}bt.disabled=true;try{await api({action:"admin-close",adminCode,ticketCode:t.ticket_code,reason});await load()}catch(e){alert(e.message);bt.disabled=false}}}box.appendChild(el)});}catch(e){box.innerHTML='<p style="color:#a22">'+esc(e.message)+'</p>'}}
document.getElementById("login-btn").onclick=async()=>{adminCode=document.getElementById("admin-code").value.trim();try{await api({action:"admin-list",adminCode,status:"OPEN"});document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block";sessionStorage.setItem("h_admin",adminCode);load()}catch(e){document.getElementById("login-msg").textContent=e.message}};
document.getElementById("refresh").onclick=load;document.getElementById("filter").onchange=load;
const saved=sessionStorage.getItem("h_admin");if(saved){adminCode=saved;document.getElementById("admin-code").value=saved;document.getElementById("login-btn").click()}
</script></body></html>
